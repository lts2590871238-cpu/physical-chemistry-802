<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="t d"><title id="t">2003-Q26 M1、M2 两条步冷曲线</title><desc id="d">两组成均先在 B 侧液相线发生折点，再经过 G–H 包晶平台、剩余液体冷却以及 E–F 共晶平台；平台长度只作定性示意。</desc><rect width="1000" height="550" rx="16" fill="#fffdf9"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#294349}.ax{fill:none;stroke:#324b50;stroke-width:2.6}.co{fill:none;stroke:#177d86;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.ref{stroke:#d08a69;stroke-width:1.8;stroke-dasharray:7 6}</style><text x="35" y="43" font-size="25" font-weight="700">2003-Q26 · 沿原题 M₁、M₂ 两条组成竖线画</text><g class="ax"><path d="M75 90V450H467 M530 90V450H922"/></g><g class="ref"><path d="M75 225H467 M75 350H467 M530 225H922 M530 350H922"/></g><g class="co"><path d="M103 111L182 163L233 225H302L345 285L371 350H424L448 424"/><path d="M558 111L632 164L682 225H778L803 284L829 350H876L900 424"/></g><g font-size="19"><text x="94" y="80" font-size="22" font-weight="700">M₁</text><text x="549" y="80" font-size="22" font-weight="700">M₂</text><text x="90" y="214">G–H 包晶</text><text x="545" y="214">G–H 包晶</text><text x="90" y="339">E–F 共晶</text><text x="545" y="339">E–F 共晶</text><text x="95" y="477">时间 →</text><text x="548" y="477">时间 →</text><text x="48" y="108">T</text><text x="503" y="108">T</text><text x="112" y="513" font-size="17">折点：先析 B；第一平台：L+B→C；第二平台：余液→A+C。</text></g></svg>
