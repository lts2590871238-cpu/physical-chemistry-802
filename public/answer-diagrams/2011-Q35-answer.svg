<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 570" role="img" aria-labelledby="t d"><title id="t">2011-Q35 P、Q、R 三条步冷曲线</title><desc id="d">P 先析 A 后在 a–d 共晶线停留；Q 为 f 共晶组成只在 b–m 线停留；R 先析 B，经过 h–k 包晶线和 b–m 共晶线。</desc><rect width="1160" height="570" rx="16" fill="#fffdf9"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#294349}.ax{fill:none;stroke:#324b50;stroke-width:2.6}.co{fill:none;stroke:#177d86;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.ref{stroke:#d08a69;stroke-width:1.8;stroke-dasharray:7 6}</style><text x="35" y="43" font-size="25" font-weight="700">2011-Q35 · 按 P、Q、R 垂线穿过的相界作图</text><g class="ax"><path d="M70 90V445H355 M445 90V445H730 M820 90V445H1105"/></g><g class="ref"><path d="M70 338H355 M445 338H730 M820 227H1105 M820 338H1105"/></g><g class="co"><path d="M93 107L161 173L249 338H308L337 420"/><path d="M468 107L620 338H680L712 420"/><path d="M843 107L910 169L946 227H998L1040 338H1070L1090 420"/></g><g font-size="19"><text x="91" y="80" font-size="22" font-weight="700">P · 先析 A</text><text x="466" y="80" font-size="22" font-weight="700">Q · f 点共晶组成</text><text x="841" y="80" font-size="22" font-weight="700">R · 先析 B</text><text x="80" y="327">a–d 共晶</text><text x="453" y="327">b–m 共晶</text><text x="828" y="216">h–k 包晶</text><text x="828" y="327">b–m 共晶</text><text x="85" y="475">时间 →</text><text x="460" y="475">时间 →</text><text x="835" y="475">时间 →</text><text x="37" y="108">T</text><text x="412" y="108">T</text><text x="787" y="108">T</text><text x="66" y="520" font-size="17">折点在开始析晶处；只有穿过三相水平线时画恒温平台。平台长度仅为示意。</text></g></svg>
