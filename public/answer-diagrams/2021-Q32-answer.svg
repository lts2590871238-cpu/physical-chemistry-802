<path d="M95 92V485H828" stroke="#344f59" stroke-width="2.5" fill="none"/>
<path d="M130 115L245 205L355 278H500L590 370H735L804 455" stroke="#23818b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g stroke="#da7958" stroke-width="2" stroke-dasharray="5 5"><path d="M95 278H790 M95 370H790"/></g>
<g fill="#ca6349"><circle cx="245" cy="205" r="5"/><circle cx="355" cy="278" r="5"/><circle cx="590" cy="370" r="5"/></g>
