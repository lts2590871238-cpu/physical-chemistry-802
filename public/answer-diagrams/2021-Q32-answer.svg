<text x="116" y="258">上三相线</text><text x="116" y="350">EF 三相线</text><text x="100" y="512">时间 →</text><text x="63" y="113">T</text>
<text x="58" y="553" font-size="15">沿原卷虚线 a：L → L+C₂ →（L+C₂→C₁）→ L+C₁ →（L→α+C₁）→ α+C₁。</text>
<text x="58" y="580" font-size="15">只数“穿过液相线”和“两条水平三相线”；原卷无温度刻度，不写具体温度。</text></g></svg>
