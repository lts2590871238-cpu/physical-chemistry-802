<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 550" role="img" aria-labelledby="t d"><title id="t">2016-Q27 a、b 两条步冷曲线</title><desc id="d">a 位于左侧共晶组成，直接出现低共熔平台；b 先穿过右侧液相线出现析晶折点，再于较高的包晶三相线出现平台。</desc><rect width="950" height="550" rx="16" fill="#fffdf9"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#294349}.ax{fill:none;stroke:#324b50;stroke-width:2.6}.co{fill:none;stroke:#177d86;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}.ref{stroke:#d08a69;stroke-width:1.8;stroke-dasharray:7 6}</style><text x="35" y="43" font-size="25" font-weight="700">2016-Q27 · a、b 对应的冷却曲线</text><g class="ax"><path d="M75 90V440H440 M510 90V440H875"/></g><g class="ref"><path d="M75 338H440 M510 249H875"/></g><g class="co"><path d="M100 107L294 338H373L412 413"/><path d="M535 107L630 175L681 249H764L848 412"/></g><g font-size="19"><text x="94" y="80" font-size="22" font-weight="700">a · 低共熔组成</text><text x="529" y="80" font-size="22" font-weight="700">b · 先进入 9 区</text><text x="88" y="327">L → α + γ</text><text x="523" y="238">L + β → γ</text><text x="95" y="470">时间 →</text><text x="530" y="470">时间 →</text><text x="44" y="108">T</text><text x="479" y="108">T</text><text x="73" y="514" font-size="17">a 没有液相线拐点；b 的折点表示开始析出 β，平台表示包晶三相共存。</text></g></svg>
