<text x="205" y="209">液相线折点</text><text x="276" y="330">共熔平台</text><text x="585" y="246">C 的相合熔点平台</text>
<text x="72" y="513">时间 →</text><text x="490" y="513">时间 →</text><text x="30" y="127">T</text><text x="453" y="127">T</text>
<text x="64" y="559" font-size="15">核对：a 有“折点＋平台”；b 与原图 C 的组成竖线重合，只有一个平台。</text><text x="64" y="584" font-size="15">原卷未给数值温度，平台高度仅表示先后关系。</text></g></svg>
